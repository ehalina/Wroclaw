<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тумский остров - Вроцлав</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tumski.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,200&display=swap" rel="stylesheet">
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="arrow_handlers.js"></script>
    <script src="book_paths.js"></script>
    <script src="common_buttons.js"></script>
    <script src="language_menu.js"></script>
    <script src="map_modal.js"></script>
    <script type="module" src="background_music.js"></script>
    <script type="module" src="tumski_cathedral_handler.js"></script>
    <script type="module" src="map_points.js"></script>
</head>
<body>
    <!-- Кастомный курсор для стрелки вправо -->
    <div class="custom-cursor"></div>
    <!-- Область для появления кастомного курсора -->
    <div class="custom-cursor-area"></div>
    <!-- Область иконки "стрелка прямо" в правом нижнем углу -->
    <div class="custom-cursor-prostoarea">
        <div class="custom-cursor-prosto"></div>
    </div>
    <!-- Подсказка для запуска музыки -->
    <div id="musicHint" class="music-hint" data-i18n="music.hint"></div>
    <!-- Геометка: Собор Святого Иоанна Крестителя (универсальная) -->
    <div class="map-mark-area" style="top: 45%; right: 35%; width: auto; height: auto;">
        <div class="map-mark" id="tumski_cathedral"></div>
        <div class="content-wrapper">
            <img class="papera-image" alt="Papera">
            <div class="tumski-text" id="tumski-cathedral-text" data-i18n="tumski_cathedral.title"></div>
        </div>
        <audio id="bookSound3" src="media/opening-a-book.wav"></audio>
    </div>
    <!-- Геометка: Тумский мост -->
    <div class="map-mark-area" style="top: 15%; right: 15%; width: auto; height: auto;">
        <div class="map-mark" id="tumski_most"></div>
        <div class="content-wrapper">
            <img class="papera-image" alt="Papera">
            <div class="tumski-text" id="tumski-most-text" data-i18n="tumski_most.title"></div>
        </div>
    </div>
    <!-- Универсальное модальное окно для геометок -->
    <div class="most-overlay">
        <button class="close-button">×</button>
        <div class="most-container">
            <div class="image-wrapper">
                <img src="" alt="Модальное изображение" class="most-image" data-src="BOOK_IMAGE_02">
                <div class="most-text-block">
                <div class="most-title"></div>
                <div class="most-description"></div>
                </div>
                <div class="book-zones right-zones">
                    <div class="book-zone zone-1" data-zone="1"></div>
                    <div class="book-zone zone-2" data-zone="2"></div>
                    <div class="book-zone zone-3" data-zone="3"></div>
                    <div class="book-zone zone-4" data-zone="4"></div>
                </div>
                <div class="book-zones left-zones">
                    <div class="book-zone zone-1" data-zone="1"></div>
                    <div class="book-zone zone-2" data-zone="2"></div>
                    <div class="book-zone zone-3" data-zone="3"></div>
                    <div class="book-zone zone-4" data-zone="4"></div>
                </div>
            </div>
            
        </div>
    </div>
    <!-- Главная сцена с фоновым изображением и анимацией -->
    <div class="scene">
        <div class="image-container">
            <div class="image-scroll-wrapper">
                <div class="image"></div>
            </div>
        </div>
        <div class="next-image-container"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // 1. Загрузка переводов и обновление контента
            await window.i18n.loadTranslations();
            window.i18n.updatePageContent();

            // Set papera image source dynamically
            const paperaImageMost = document.querySelector('#tumski_most').parentElement.querySelector('.papera-image');
            const paperaImageCathedral = document.querySelector('#tumski_cathedral').parentElement.querySelector('.papera-image');

            // 2. Подключение обработчика для геометки собора
            import('./tumski_cathedral_handler.js').then(mod => {
                if (mod && typeof mod.setupUniversalGeoMarker === 'function') {
                    // Устанавливаем источники изображений papera
                    if (mod.setPaperaImageSource) {
                        mod.setPaperaImageSource(paperaImageMost);
                        mod.setPaperaImageSource(paperaImageCathedral);
                    }
                    
                    // Геометка Катедра
                    mod.setupUniversalGeoMarker({
                        markerId: 'tumski_cathedral',
                        i18nKey: 'tumski_cathedral',
                        position: { top: '30%', right: '15%', width: 'auto', height: 'auto' }
                    });
                    // Геометка Тумский мост
                    mod.setupUniversalGeoMarker({
                        markerId: 'tumski_most',
                        i18nKey: 'tumski_most',
                        position: { top: '40%', right: '20%', width: 'auto', height: 'auto' }
                    });
                    // mod.setupUniversalGeoMarker({
                    //     markerId: 'tumski',
                    //     i18nKey: 'tumski',
                    //     position: { top: '10%', right: '10%', width: 'auto', height: 'auto' }
                    // });
                }
            });

            // 4. Инициализация языкового меню
            LanguageMenu.init();

            // 5. Инициализация модального окна карты
            MapModal.init();

            // 6. Применение общих стилей кнопок
            applyCommonButtonStyles();

            // 7. Запуск фоновой музыки (универсальный модуль)
            import('./background_music.js').then(mod => {
                if (mod && typeof mod.initBackgroundMusic === 'function') {
                    mod.initBackgroundMusic();
                }
            });

            // 8. Инициализация логики книги (универсальный модуль)
            if (window.BookPaths && typeof window.BookPaths.initBookHandlers === 'function') {
                window.BookPaths.initBookHandlers();
            }

            // 9. Инициализация кастомных курсоров
            const cursor = document.querySelector('.custom-cursor');
            const cursorArea = document.querySelector('.custom-cursor-area');
            const cursorProsto = document.querySelector('.custom-cursor-prosto');
            const cursorProstoArea = document.querySelector('.custom-cursor-prostoarea');
            
            console.log('Элементы курсоров:', {
                cursor: !!cursor,
                cursorArea: !!cursorArea,
                cursorProsto: !!cursorProsto,
                cursorProstoArea: !!cursorProstoArea
            });
            
            // Создаем звук шага
            let stepSound;

            // Инициализируем обработчики курсоров
            import('./tumski_cathedral_handler.js').then(mod => {
                if (mod.createStepSound) {
                    stepSound = mod.createStepSound();
                }
                
                if (cursor && cursorArea) {
                    console.log('Инициализация стрелки вправо');
                    setupRightArrowHandler(cursor, cursorArea, stepSound);
                } else {
                    console.error('Не найдены элементы для стрелки вправо');
                }
                
                if (cursorProsto && cursorProstoArea) {
                    console.log('Инициализация стрелки прямо');
                    setupForwardArrowHandler(cursorProsto, cursorProstoArea, stepSound, () => {
                        // Переход на следующую страницу
                        window.location.href = 'tumski_02.html';
                    });
                } else {
                    console.error('Не найдены элементы для стрелки прямо');
                }
            });
        });


    </script>
</body>
</html>
