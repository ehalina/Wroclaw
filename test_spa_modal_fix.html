<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест SPA Modal Fix</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="common_tumski.css">
    <link rel="stylesheet" href="tumski.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,200&display=swap" rel="stylesheet">
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="arrow_handlers.js"></script>
    <script src="book_paths.js"></script>
    <script src="common_buttons.js"></script>
    <script src="language_menu.js"></script>
    <script src="map_modal.js"></script>
    <script type="module" src="background_music.js"></script>
    <script type="module" src="tumski_cathedral_handler.js"></script>
    <script type="module" src="map_points.js"></script>
    <script type="module" src="spa_integration.js"></script>
    <style>
        /* SPA специфичные стили */
        #spa-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .page-content {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        .page-content.active {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            font-size: 24px;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .test-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 10001;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <div>Тест SPA Modal Fix</div>
        <div>Language Menu должен отключаться при открытии модалки</div>
    </div>
    
    <div id="spa-container">
        <!-- Страницы будут загружаться здесь -->
    </div>
    
    <div id="loadingOverlay" class="loading-overlay">
        <div>Загрузка...</div>
    </div>

    <script>
        // SPA Manager для управления страницами
        class SPAManager {
            constructor() {
                this.pages = new Map();
                this.currentPage = null;
                this.init();
            }

            async init() {
                console.log('🚀 Инициализация SPA Manager...');
                
                // Загружаем начальную страницу
                await this.loadPage('tumski.html');
                
                // Инициализируем обработчики
                this.setupEventListeners();
            }

            async loadPage(pageName) {
                console.log('📄 Загрузка страницы:', pageName);
                
                // Показываем индикатор загрузки
                this.showLoading();
                
                try {
                    // Если страница уже загружена, просто переключаемся на неё
                    if (this.pages.has(pageName)) {
                        this.showPage(pageName);
                        this.hideLoading();
                        return;
                    }
                    
                    // Создаем iframe для страницы
                    const iframe = document.createElement('iframe');
                    // Добавляем timestamp для предотвращения кэширования
                    const timestamp = new Date().getTime();
                    iframe.src = `${pageName}?t=${timestamp}`;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.position = 'absolute';
                    iframe.style.top = '0';
                    iframe.style.left = '0';
                    iframe.style.zIndex = '1';
                    
                    // Создаем контейнер для страницы
                    const pageContainer = document.createElement('div');
                    pageContainer.className = 'page-content';
                    pageContainer.id = `page-${pageName.replace('.html', '')}`;
                    pageContainer.appendChild(iframe);
                    
                    // Добавляем в SPA контейнер
                    document.getElementById('spa-container').appendChild(pageContainer);
                    
                    // Сохраняем страницу
                    this.pages.set(pageName, pageContainer);
                    
                    // Ждем загрузки iframe
                    iframe.onload = () => {
                        console.log('✅ iframe загружен:', pageName);
                        this.setupIframeNavigation(iframe, pageName);
                        this.showPage(pageName);
                        this.hideLoading();
                    };
                    
                    iframe.onerror = () => {
                        console.error('❌ Ошибка загрузки iframe:', pageName);
                        this.hideLoading();
                    };
                    
                } catch (error) {
                    console.error('❌ Ошибка загрузки страницы:', error);
                    this.hideLoading();
                }
            }
            
            setupIframeNavigation(iframe, pageName) {
                // Настраиваем навигацию внутри iframe
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Обработчики для стрелок навигации
                    const arrowHandlers = iframeDoc.querySelectorAll('[data-prev-page], [data-next-page]');
                    arrowHandlers.forEach(handler => {
                        handler.addEventListener('click', (e) => {
                            e.preventDefault();
                            const targetPage = handler.dataset.prevPage || handler.dataset.nextPage;
                            if (targetPage) {
                                this.navigateToPage(targetPage);
                            }
                        });
                    });
                    
                    // Обработчики для всех ссылок
                    const links = iframeDoc.querySelectorAll('a[href$=".html"]');
                    links.forEach(link => {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            const href = link.getAttribute('href');
                            if (href) {
                                this.navigateToPage(href);
                            }
                        });
                    });
                    
                    // Обработчики для quest модального окна в iframe
                    this.setupQuestModalHandlers(iframeDoc);
                    
                } catch (error) {
                    console.log('⚠️ Не удалось настроить навигацию iframe (возможно, CORS):', error);
                }
            }
            
            setupQuestModalHandlers(iframeDoc) {
                console.log('🔧 Настройка обработчиков quest модального окна в iframe...');
                
                // Обработчик для открытия quest модального окна в iframe
                const bookOverlay = iframeDoc.querySelector('.book-overlay');
                if (bookOverlay) {
                    console.log('🔧 Найден book-overlay для обработки открытия модального окна');
                    
                    // Создаем MutationObserver для отслеживания изменений display
                    const observer = new MutationObserver(function(mutations) {
                        mutations.forEach(function(mutation) {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                                const target = mutation.target;
                                const computedStyle = window.getComputedStyle(target);
                                if (computedStyle.display === 'flex') {
                                    console.log('🔧 Quest модальное окно открыто в iframe, отключаем LanguageMenu');
                                    // Отключаем language-menu при открытии модалки
                                    if (window.LanguageMenu && typeof window.LanguageMenu.disableMenu === 'function') {
                                        window.LanguageMenu.disableMenu();
                                    }
                                }
                            }
                        });
                    });
                    
                    // Начинаем наблюдение за изменениями стилей
                    observer.observe(bookOverlay, {
                        attributes: true,
                        attributeFilter: ['style']
                    });
                } else {
                    console.log('⚠️ book-overlay не найден в iframe для обработки открытия');
                }
                
                // Обработчик для кнопки закрытия quest модального окна в iframe
                const questCloseButton = iframeDoc.querySelector('.book-overlay .close-button');
                if (questCloseButton) {
                    console.log('🔧 Найден обработчик кнопки закрытия quest модального окна');
                    questCloseButton.addEventListener('click', function() {
                        console.log('🔧 Клик по кнопке закрытия quest модального окна');
                        const bookOverlay = iframeDoc.querySelector('.book-overlay');
                        const container = iframeDoc.querySelector('.image-container');
                        
                        if (bookOverlay) {
                            bookOverlay.style.display = 'none';
                            
                            // Включаем language-menu при закрытии модалки
                            if (window.LanguageMenu && typeof window.LanguageMenu.enableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.enableMenu() из SPA');
                                window.LanguageMenu.enableMenu();
                            }
                            
                            // Возобновляем анимацию контейнера
                            if (container) {
                                container.style.animationPlayState = 'running';
                            }
                        }
                    });
                } else {
                    console.log('⚠️ Кнопка закрытия quest модального окна не найдена в iframe');
                }

                // Закрытие quest модального окна по клику вне его в iframe
                if (bookOverlay) {
                    console.log('🔧 Найден book-overlay для обработки клика вне модального окна');
                    bookOverlay.addEventListener('click', function(e) {
                        if (e.target === bookOverlay) {
                            console.log('🔧 Клик вне quest модального окна');
                            const container = iframeDoc.querySelector('.image-container');
                            
                            bookOverlay.style.display = 'none';
                            
                            // Включаем language-menu при закрытии модалки
                            if (window.LanguageMenu && typeof window.LanguageMenu.enableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.enableMenu() из SPA (клик вне)');
                                window.LanguageMenu.enableMenu();
                            }
                            
                            // Возобновляем анимацию контейнера
                            if (container) {
                                container.style.animationPlayState = 'running';
                            }
                        }
                    });
                } else {
                    console.log('⚠️ book-overlay не найден в iframe');
                }
            }
            
            showPage(pageName) {
                console.log('🎵 showPage вызван для:', pageName);
                
                // Скрываем все страницы
                this.pages.forEach((page, name) => {
                    page.classList.remove('active');
                });
                
                // Показываем нужную страницу
                const targetPage = this.pages.get(pageName);
                if (targetPage) {
                    targetPage.classList.add('active');
                    this.currentPage = pageName;
                }
            }
            
            showLoading() {
                document.getElementById('loadingOverlay').classList.remove('hidden');
            }
            
            hideLoading() {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
            
            setupEventListeners() {
                // Обработчик для кнопки "Назад" в браузере
                window.addEventListener('popstate', (event) => {
                    if (event.state && event.state.page) {
                        this.showPage(event.state.page);
                    }
                });
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Инициализация тестовой SPA страницы...');
            
            // Инициализируем LanguageMenu для кнопки звука
            if (window.LanguageMenu && typeof window.LanguageMenu.init === 'function') {
                window.LanguageMenu.init();
            }
            
            window.spaManager = new SPAManager();
        });
    </script>
</body>
</html>
