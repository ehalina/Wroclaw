<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Минск - Вроцлав</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="common_tumski.css">
    <link rel="stylesheet" href="minsk01.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,200&display=swap" rel="stylesheet">
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="arrow_handlers.js"></script>
    <script src="book_paths.js"></script>
    <script src="common_buttons.js"></script>
    <script src="language_menu.js"></script>
    <script src="map_modal.js"></script>
    <script type="module" src="tumski_cathedral_handler.js"></script>
    <script type="module" src="map_points.js"></script>
</head>
<body>

    <!-- Подсказка для запуска музыки -->
    <div id="musicHint" class="music-hint" data-i18n="music.hint"></div>
    <!-- Подсказка для возврата анимации -->
    <div id="animationHint" class="animation-hint" data-i18n="animation.hint"></div>

    <!-- Геометка: Гном Синяя коза -->
    <div class="map-mark-area">
        <div
            class="map-mark"
            id="gnome_blue_goat"
            data-gnome-id="blue_goat"
            data-x-desktop="1000"
            data-y-desktop="952"
            data-x-mobile="1312"
            data-y-mobile="912"
            style="background-image: url('media/krasnal.png');"
        ></div>
        <div class="content-wrapper">
            <img class="papera-image" alt="Papera">
            <div class="tumski-text" id="gnome-blue-goat-text" data-i18n="gnomes.blue_goat.title"></div>
        </div>
    </div>

    <!-- Главная сцена с фоновым изображением и анимацией -->
    <div class="scene">
        <div class="image-container" data-map-point="41">
            <div class="image-scroll-wrapper">
                <div class="image">
                    <!-- Стрелка прямо влево -->
                    <div class="custom-cursor-prosto-left" data-x-desktop="400" data-y-desktop="1200" data-x-mobile="600" data-y-mobile="1300" data-next-page="minsk02.html"></div>
                    <div class="custom-cursor-prosto-leftarea" data-x-desktop="400" data-y-desktop="1200" data-x-mobile="600" data-y-mobile="1300">
                    </div>
                </div>
            </div>
        </div>
        <div class="next-image-container"></div>
    </div>

    <!-- Аудио для музыки -->
    <audio id="minskMusic" loop>
        <source src="media/zwyki/maksim-mrvica-croatian-rhapsody.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="tumski_init.js"></script>
    <script type="module">
        // Закрываем модальное окно карты, если оно открыто
        function closeMapModal() {
            try {
                // Закрываем в родительском окне (SPA)
                if (window.parent && window.parent !== window) {
                    const mapModal = window.parent.document.getElementById('map-modal');
                    if (mapModal) {
                        mapModal.style.display = 'none';
                        // Останавливаем звук карты, если есть
                        const mapSound = window.parent.document.getElementById('mapSound');
                        if (mapSound) {
                            mapSound.pause();
                            mapSound.currentTime = 0;
                        }
                    }
                }
            } catch (_) {}
            
            // Закрываем в текущем окне (если есть)
            try {
                const mapModal = document.getElementById('map-modal');
                if (mapModal) {
                    mapModal.style.display = 'none';
                    const mapSound = document.getElementById('mapSound');
                    if (mapSound) {
                        mapSound.pause();
                        mapSound.currentTime = 0;
                    }
                }
            } catch (_) {}
        }

        // Отключаем карту на этой странице
        function disableMapButton() {
            // Отключаем кнопку карты в родительском окне (SPA)
            try {
                if (window.parent && window.parent !== window) {
                    const mapButton = window.parent.document.getElementById('open-map-modal');
                    if (mapButton) {
                        mapButton.style.display = 'none';
                        mapButton.style.pointerEvents = 'none';
                        mapButton.style.opacity = '0';
                        // Удаляем обработчики событий
                        const newButton = mapButton.cloneNode(true);
                        mapButton.parentNode.replaceChild(newButton, mapButton);
                    }
                }
            } catch (_) {}
            
            // Отключаем кнопку карты в текущем окне (если есть)
            try {
                const mapButton = document.getElementById('open-map-modal');
                if (mapButton) {
                    mapButton.style.display = 'none';
                    mapButton.style.pointerEvents = 'none';
                    mapButton.style.opacity = '0';
                    // Удаляем обработчики событий
                    const newButton = mapButton.cloneNode(true);
                    mapButton.parentNode.replaceChild(newButton, mapButton);
                }
            } catch (_) {}
        }

        // Закрываем модальное окно карты и отключаем карту сразу и после загрузки
        closeMapModal();
        disableMapButton();
        document.addEventListener('DOMContentLoaded', function() {
            closeMapModal();
            disableMapButton();
            // Повторяем через небольшую задержку на случай, если элементы создаются позже
            setTimeout(() => {
                closeMapModal();
                disableMapButton();
            }, 100);
            setTimeout(() => {
                closeMapModal();
                disableMapButton();
            }, 500);
            setTimeout(() => {
                closeMapModal();
                disableMapButton();
            }, 1000);
        });

        // Автоматический запуск музыки при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            const audio = document.getElementById('minskMusic');
            if (!audio) return;
            
            // Сохраняем состояние музыки в родительском окне (localStorage), чтобы оно сохранялось при перезагрузке iframe
            function saveMusicState() {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.localStorage.setItem('minskMusicState', audio.paused ? 'paused' : 'playing');
                        window.parent.localStorage.setItem('minskMusicTime', audio.currentTime.toString());
                    } else {
                        localStorage.setItem('minskMusicState', audio.paused ? 'paused' : 'playing');
                        localStorage.setItem('minskMusicTime', audio.currentTime.toString());
                    }
                } catch (e) {
                    // Fallback на localStorage текущего окна
                    localStorage.setItem('minskMusicState', audio.paused ? 'paused' : 'playing');
                    localStorage.setItem('minskMusicTime', audio.currentTime.toString());
                }
            }
            
            function getMusicState() {
                try {
                    if (window.parent && window.parent !== window) {
                        return {
                            state: window.parent.localStorage.getItem('minskMusicState'),
                            time: window.parent.localStorage.getItem('minskMusicTime')
                        };
                    } else {
                        return {
                            state: localStorage.getItem('minskMusicState'),
                            time: localStorage.getItem('minskMusicTime')
                        };
                    }
                } catch (e) {
                    return {
                        state: localStorage.getItem('minskMusicState'),
                        time: localStorage.getItem('minskMusicTime')
                    };
                }
            }
            
            // Проверяем, играет ли уже музыка из предыдущей загрузки страницы
            const savedState = getMusicState();
            const isMuted = localStorage.getItem('soundMuted') === 'true';
            
            // Проверяем, откуда пришел пользователь (через sessionStorage или referrer)
            let cameFromMinsk02 = false;
            try {
                const prevPage = sessionStorage.getItem('previousPage');
                cameFromMinsk02 = prevPage && prevPage.includes('minsk02.html');
                if (!cameFromMinsk02) {
                    const referrer = document.referrer;
                    cameFromMinsk02 = referrer && referrer.includes('minsk02.html');
                }
            } catch (e) {
                const referrer = document.referrer;
                cameFromMinsk02 = referrer && referrer.includes('minsk02.html');
            }
            
            // Если музыка уже играла, восстанавливаем время и продолжаем воспроизведение
            if (savedState.state === 'playing' && savedState.time) {
                const savedTime = parseFloat(savedState.time);
                if (!isNaN(savedTime) && savedTime > 0) {
                    // Ждем загрузки метаданных перед установкой времени
                    audio.addEventListener('loadedmetadata', function() {
                        audio.currentTime = savedTime;
                    }, { once: true });
                    
                    // Если пришли с minsk02, восстанавливаем время и запускаем play() только один раз
                    // Музыка должна продолжить играть с того же места
                    if (cameFromMinsk02) {
                        if (!isMuted) {
                            // Небольшая задержка, чтобы currentTime успел установиться
                            setTimeout(function() {
                                audio.play().catch(function(error) {
                                    console.log('Ошибка при возобновлении музыки:', error);
                                });
                            }, 100);
                        }
                        // Выходим, чтобы не выполнять код ниже
                        return;
                    }
                    
                    // Если звук не выключен и НЕ пришли с minsk02, запускаем воспроизведение
                    if (!isMuted) {
                        // Небольшая задержка, чтобы currentTime успел установиться
                        setTimeout(function() {
                            audio.play().catch(function(error) {
                                console.log('Ошибка при возобновлении музыки:', error);
                            });
                        }, 100);
                    }
                } else {
                    // Если время невалидно, запускаем с начала (только если не пришли с minsk02)
                    if (!isMuted && !cameFromMinsk02) {
                        audio.play().catch(function(error) {
                            console.log('Автозапуск музыки заблокирован, требуется взаимодействие пользователя:', error);
                        });
                    }
                }
            } else {
                // Первый запуск - запускаем музыку (только если не пришли с minsk02)
                if (!isMuted && !cameFromMinsk02) {
                    audio.play().catch(function(error) {
                        console.log('Автозапуск музыки заблокирован, требуется взаимодействие пользователя:', error);
                    });
                }
            }
            
            // Сохраняем состояние музыки каждые 0.5 секунды для более точного восстановления
            setInterval(saveMusicState, 500);
            
            // Сохраняем состояние при паузе/воспроизведении
            audio.addEventListener('play', saveMusicState);
            audio.addEventListener('pause', saveMusicState);
            audio.addEventListener('timeupdate', function() {
                // Сохраняем время каждые 2 секунды (не слишком часто)
                if (Math.floor(audio.currentTime) % 2 === 0) {
                    saveMusicState();
                }
            });
        });
        
        // Обработчик для управления музыкой из родительского окна (SPA)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'soundControl') {
                const audio = document.getElementById('minskMusic');
                if (audio) {
                    function saveMusicState() {
                        try {
                            if (window.parent && window.parent !== window) {
                                window.parent.localStorage.setItem('minskMusicState', audio.paused ? 'paused' : 'playing');
                                window.parent.localStorage.setItem('minskMusicTime', audio.currentTime.toString());
                            } else {
                                localStorage.setItem('minskMusicState', audio.paused ? 'paused' : 'playing');
                                localStorage.setItem('minskMusicTime', audio.currentTime.toString());
                            }
                        } catch (e) {
                            localStorage.setItem('minskMusicState', audio.paused ? 'paused' : 'playing');
                            localStorage.setItem('minskMusicTime', audio.currentTime.toString());
                        }
                    }
                    
                    if (event.data.action === 'mute') {
                        audio.pause();
                        saveMusicState();
                    } else if (event.data.action === 'unmute') {
                        // Восстанавливаем время воспроизведения из localStorage родительского окна
                        try {
                            const savedTime = window.parent && window.parent !== window 
                                ? window.parent.localStorage.getItem('minskMusicTime')
                                : localStorage.getItem('minskMusicTime');
                            if (savedTime) {
                                const time = parseFloat(savedTime);
                                if (!isNaN(time) && time > 0) {
                                    audio.currentTime = time;
                                }
                            }
                        } catch (e) {
                            const savedTime = localStorage.getItem('minskMusicTime');
                            if (savedTime) {
                                const time = parseFloat(savedTime);
                                if (!isNaN(time) && time > 0) {
                                    audio.currentTime = time;
                                }
                            }
                        }
                        audio.play().catch(() => {});
                        saveMusicState();
                    }
                }
            }
        });
    </script>
</body>
</html>
