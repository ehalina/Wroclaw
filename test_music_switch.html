<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест переключения музыки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-button {
            display: block;
            margin: 10px 0;
            padding: 15px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .test-button:hover {
            background: #0056b3;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Тест переключения музыки для страниц ogrod</h1>
    
    <div class="status" id="status">
        Готов к тестированию
    </div>
    
    <button class="test-button" onclick="testTownMusic()">Тест: town.mp3 (обычные страницы)</button>
    <button class="test-button" onclick="testBirdsMusic()">Тест: birds.mp3 (ogrod страницы)</button>
    <button class="test-button" onclick="testKostelMusic()">Тест: kostel.mp3 (tumski19)</button>
    <button class="test-button" onclick="testHangMusic()">Тест: hang.mp3 (tumski21)</button>
    <button class="test-button" onclick="stopAllMusic()">Остановить всю музыку</button>
    
    <!-- Аудио элементы -->
    <audio id="backgroundMusic" loop>
        <source src="media/zwyki/town.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="kostelMusic" loop>
        <source src="media/zwyki/kostel.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="hangMusic" loop>
        <source src="media/zwyki/hang.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="birdsMusic" loop>
        <source src="media/zwyki/birds.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }
        
        function stopAllMusic() {
            const musics = ['backgroundMusic', 'kostelMusic', 'hangMusic', 'birdsMusic'];
            musics.forEach(id => {
                const audio = document.getElementById(id);
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
            updateStatus('Вся музыка остановлена');
        }
        
        function testTownMusic() {
            stopAllMusic();
            const townMusic = document.getElementById('backgroundMusic');
            if (townMusic) {
                townMusic.play().then(() => {
                    updateStatus('✅ town.mp3 запущен (обычные страницы)');
                }).catch(error => {
                    updateStatus('❌ Ошибка запуска town.mp3: ' + error.message);
                });
            }
        }
        
        function testBirdsMusic() {
            stopAllMusic();
            const birdsMusic = document.getElementById('birdsMusic');
            if (birdsMusic) {
                birdsMusic.play().then(() => {
                    updateStatus('✅ birds.mp3 запущен (ogrod страницы)');
                }).catch(error => {
                    updateStatus('❌ Ошибка запуска birds.mp3: ' + error.message);
                });
            }
        }
        
        function testKostelMusic() {
            stopAllMusic();
            const kostelMusic = document.getElementById('kostelMusic');
            if (kostelMusic) {
                kostelMusic.play().then(() => {
                    updateStatus('✅ kostel.mp3 запущен (tumski19)');
                }).catch(error => {
                    updateStatus('❌ Ошибка запуска kostel.mp3: ' + error.message);
                });
            }
        }
        
        function testHangMusic() {
            stopAllMusic();
            const hangMusic = document.getElementById('hangMusic');
            if (hangMusic) {
                hangMusic.play().then(() => {
                    updateStatus('✅ hang.mp3 запущен (tumski21)');
                }).catch(error => {
                    updateStatus('❌ Ошибка запуска hang.mp3: ' + error.message);
                });
            }
        }
        
        // Инициализация
        updateStatus('Тест готов. Нажмите кнопки для проверки переключения музыки.');
    </script>
</body>
</html>
