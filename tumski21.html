<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тумский остров - Вроцлав</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="common_tumski.css">
    <link rel="stylesheet" href="tumski21.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,200&display=swap" rel="stylesheet">
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="arrow_handlers.js"></script>
    <script src="book_paths.js"></script>
    <script src="common_buttons.js"></script>
    <script src="language_menu.js"></script>
    <script src="map_modal.js"></script>
    <script src="sunset_parallax.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="background_music.js"></script>
    <script type="module" src="tumski_cathedral_handler.js"></script>
    <script type="module" src="map_points.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .page-container {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            position: relative;
            overflow: hidden;
            background: #000;
            aspect-ratio: 1120 / 832;
        }

        .parallax-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .parallax-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 0;
            pointer-events: none;
        }

        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform-origin: center center;
        }

        .layer-sky {
            background-image: url('media/tumski/sunset/sunset3.png');
            z-index: 1;
        }

        .layer-horizon {
            background-image: url('media/tumski/sunset/sunset2.png');
            z-index: 2;
        }

        .layer-buildings {
            background-image: url('media/tumski/sunset/sunset1.png');
            z-index: 3;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
        }

        .control-group input {
            width: 100%;
            margin-bottom: 5px;
        }

        .control-group button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .control-group button:hover {
            background: #45a049;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            max-width: 300px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .page-container {
                width: auto;
                height: 100vh;
                max-width: 100vw;
            }
            
            .controls {
                top: 10px;
                right: 10px;
                padding: 10px;
                font-size: 12px;
            }
            
            .info {
                bottom: 10px;
                left: 10px;
                padding: 10px;
                font-size: 11px;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>

    <!-- Подсказка для запуска музыки -->
    <div id="musicHint" class="music-hint" data-i18n="music.hint"></div>
    <!-- Подсказка для возврата анимации -->
    <div id="animationHint" class="animation-hint" data-i18n="animation.hint"></div>

    <!-- Главная сцена с фоновым изображением и анимацией -->
    <div class="loading">Загрузка изображений...</div>
    
    <div class="scene" ondblclick="window.sunsetParallax.restartParallax()">
        <div class="image-container" data-map-point="19">
            <div class="image"></div></div>
            <div class="page-container">
                <div class="parallax-container">
                    <div class="parallax-layer layer-sky"></div>
                    <div class="parallax-layer layer-horizon"></div>
                    <div class="parallax-layer layer-buildings"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Скорость зума:</label>
            <input type="range" id="zoomSpeed" min="0.1" max="2" step="0.1" value="0.3">
            <span id="zoomSpeedValue">0.3</span>
        </div>
        <div class="control-group">
            <label>Пауза:</label>
            <button id="pauseBtn">Пауза</button>
            <button id="resetBtn">Сброс</button>
        </div>
        <div class="control-group">
            <label>Направление:</label>
            <button id="directionBtn">Вперед</button>
        </div>
    </div>

    <script type="module" src="tumski_init.js"></script>
    <audio id="backgroundMusic" loop autoplay hidden>
        <source src="media/zwyki/hang.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает элемент audio.
    </audio>
    <script>
        const zoomSpeedInput = document.getElementById('zoomSpeed');
        const pageContainer = document.querySelector('.page-container');
        const parallaxContainer = document.querySelector('.parallax-container');

        zoomSpeedInput.addEventListener('input', function() {
            const zoomLevel = parseFloat(zoomSpeedInput.value);
            if (zoomLevel > 1) {
                pageContainer.classList.add('zoom-in');
                pageContainer.classList.remove('zoom-out');
                parallaxContainer.classList.add('zoom-in');
                parallaxContainer.classList.remove('zoom-out');
            } else {
                pageContainer.classList.add('zoom-out');
                pageContainer.classList.remove('zoom-in');
                parallaxContainer.classList.add('zoom-out');
                parallaxContainer.classList.remove('zoom-in');
            }
        });
    </script>
</body>
</html>
