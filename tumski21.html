<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тумский остров - Вроцлав</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="common_tumski.css">
    <link rel="stylesheet" href="tumski21.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,200&display=swap" rel="stylesheet">
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="arrow_handlers.js"></script>
    <script src="book_paths.js"></script>
    <script src="common_buttons.js"></script>
    <script src="language_menu.js"></script>
    <script src="map_modal.js"></script>
    <script src="sunset_parallax.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="background_music.js"></script>
    <script type="module" src="tumski_cathedral_handler.js"></script>
    <script type="module" src="map_points.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .page-container {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            position: relative;
            overflow: hidden;
            background: #000;
            aspect-ratio: 1120 / 832;
        }

        .parallax-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .parallax-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 0;
            pointer-events: none;
        }

        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform-origin: center center;
        }

        .layer-sky {
            background-image: url('media/tumski/sunset/sunset3.jpg');
            z-index: 1;
        }

        .layer-horizon {
            background-image: url('media/tumski/sunset/sunset2.png');
            z-index: 2;
        }

        .layer-buildings {
            background-image: url('media/tumski/sunset/sunset1.png');
            z-index: 3;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
        }

        .control-group input {
            width: 100%;
            margin-bottom: 5px;
        }

        .control-group button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .control-group button:hover {
            background: #45a049;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            max-width: 300px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
           .page-container {
            width: 300vw;
        height: 100vh;
        background-size: auto 100%;
        background-repeat: no-repeat;
        background-position: left top;
        display: block;
        position: relative;
        transition: opacity 0.1s ease-in;
        backface-visibility: hidden;
        will-change: transform;
        transform-style: preserve-3d;
        transform: translateZ(0);
        pointer-events: auto !important;
                aspect-ratio: 1120 / 832;
            } 
            
            .controls {
                top: 10px;
                right: 10px;
                padding: 10px;
                font-size: 12px;
            }
            
            .info {
                bottom: 10px;
                left: 10px;
                padding: 10px;
                font-size: 11px;
                max-width: 250px;
            }
            .image-scroll-wrapper {
        width: 100vw;
        height: 100vh;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        white-space: nowrap;
    }
    
    .image {
        width: 300vw;
        height: 100vh;
        background-size: auto 100%;
        background-repeat: no-repeat;
        background-position: left top;
        display: block;
        position: relative;
        transition: opacity 0.1s ease-in;
        backface-visibility: hidden;
        will-change: transform;
        transform-style: preserve-3d;
        transform: translateZ(0);
        pointer-events: auto !important;
    }
    
    .image::after {
        content: '';
        display: block;
        width: 300vw;
        height: 1px;
    }
        }
    </style>
</head>
<body>

    <!-- Подсказка для запуска музыки -->
    <div id="musicHint" class="music-hint" data-i18n="music.hint"></div>
    <!-- Подсказка для возврата анимации -->
    <div id="animationHint" class="animation-hint" data-i18n="animation.hint"></div>

    <!-- Главная сцена с фоновым изображением и анимацией -->
    <div class="loading"></div>
    
    <div class="scene" ondblclick="window.sunsetParallax.restartParallax()">
        <div class="image-container" data-map-point="19">
            <div class="image-scroll-wrapper">
                <div class="image">
                    <div class="page-container">
                        <div class="parallax-container">
                            <div class="parallax-layer layer-sky"></div>
                            <div class="parallax-layer layer-horizon"></div>
                            <div class="parallax-layer layer-buildings"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="tumski_init.js"></script>
    <audio id="backgroundMusic" loop autoplay hidden>
        <source src="media/zwyki/hang.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает элемент audio.
    </audio>
</body>
</html>
