<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Scroll Image</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tumski.css">
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,200&display=swap" rel="stylesheet">
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="arrow_handlers.js"></script>
  <script src="book_paths.js"></script>
  <script src="common_buttons.js"></script>
  <script src="language_menu.js"></script>
  <script src="map_modal.js"></script>
  <script type="module" src="background_music.js"></script>
  <script type="module" src="tumski_cathedral_handler.js"></script>
  <script type="module" src="map_points.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    .scene {
      height: 100vh;
    }

    .image-container {
      height: 100vh;
    }

    .image-scroll-wrapper {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      white-space: nowrap;
    }

    .image {
      width: 200vw; /* делаем шире экрана, чтобы был скролл */
      height: 100vh;
      background-image: url("media/tumski/tumski_01.jpg");
      background-size: auto 100%;
      background-repeat: no-repeat;
      background-position: left center;
      display: block;
      position: relative;
      transition: opacity 0.1s ease-in;
      backface-visibility: hidden;
      will-change: transform;
      transform-style: preserve-3d;
      transform: translateZ(0);
      /* Для анимации */
    }

    /* Вспомогательный блок для создания физического контента шириной 200vw */
    .image::after {
      content: '';
      display: block;
      width: 200vw;
      height: 1px;
    }

    @keyframes zoomForward {
      0% {
        transform: translateZ(0) scale(1) translate(0, 0);
      }
      100% {
        transform: translateZ(2000px) scale(2.5) translate(-35vw, -25vh);
      }
    }

    .zoom-transition {
      animation: zoomForward 1.5s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="image-container">
      <div class="image-scroll-wrapper">
        <div class="image" id="mainImage"></div>
      </div>
    </div>
  </div>
  <script>
    // Запуск анимации по клику на фон
    const image = document.getElementById('mainImage');
    image.addEventListener('click', function() {
      image.classList.add('zoom-transition');
      // Вернуть в исходное состояние через 1.5с (длительность анимации)
      setTimeout(() => {
        image.classList.remove('zoom-transition');
      }, 1500);
    });
  </script>
</body>
</html>
