    <style>
        /* SPA специфичные стили */
        #spa-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .page-content {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        .page-content.active {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            font-size: 18px;
        }
        
        .loading-overlay.hidden {
            display: none;
        }

<body>

        🎵 Нажмите для запуска музыки
    </div> -->
    
    <!-- Индикатор загрузки -->
    <div id="loadingOverlay" class="loading-overlay">
        <div>Загрузка...</div>

    <!-- Простой аудио элемент для музыки -->
    <audio id="backgroundMusic" loop>
        <source src="media/zwyki/town.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Аудио элемент для kostel.mp3 -->
    <audio id="kostelMusic" loop>
        <source src="media/zwyki/kostel.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Аудио элемент для hang.mp3 -->
    <audio id="hangMusic" loop>
        <source src="media/zwyki/hang.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Аудио элемент для birds.mp3 -->
    <audio id="birdsMusic" loop>
        <source src="media/zwyki/birds.mp3" type="audio/mpeg">
    </audio>
    
    <!-- SPA контейнер -->
    <div id="spa-container">
        <!-- Контент страниц будет загружаться сюда -->
    </div>
    
    <script type="module">
        // Простая SPA система управления страницами с iframe
        class SPAManager {
            constructor() {
                this.currentPage = null;
                this.pages = new Map();
                this.stepSound = null;
                this.init();
            }
            
            /**
             * Проверяет, включен ли звук
             * @returns {boolean} true если звук включен, false если выключен
             */
            isSoundEnabled() {
                const soundMuted = localStorage.getItem('soundMuted');
                // По умолчанию звук включен (если значение не установлено или 'false')
                return soundMuted !== 'true';
            }
            
            /**
             * Инициализирует звук шага
             */
            initStepSound() {
                if (!this.stepSound) {
                    this.stepSound = new Audio('media/step.wav');
                    this.stepSound.volume = 1.0; // Максимальная громкость
                    this.stepSound.preload = 'auto';
                }
            }
            
            /**
             * Воспроизводит звук шага
             */
            playStepSound() {
                if (this.isSoundEnabled() && this.stepSound) {
                    try {
                        this.stepSound.currentTime = 0;
                        this.stepSound.play().catch(error => {
                            console.log('🎵 Ошибка воспроизведения step.wav:', error);
                        });
                    } catch (error) {
                        console.log('🎵 Ошибка воспроизведения step.wav:', error);
                    }
                }
            }
            
            async init() {
                console.log('🚀 Инициализация SPA...');
                
                // Инициализируем звук шага
                this.initStepSound();
                
                // Запускаем музыку сразу при загрузке
                this.startBackgroundMusic();
                
                // Загружаем первую страницу (tumski.html)
                await this.loadPage('tumski.html');
                
                // Инициализируем обработчики
                this.setupEventListeners();
            }
            
            startBackgroundMusic() {
                console.log('🎵 Запуск фоновой музыки town.mp3...');
                
                const audio = document.getElementById('backgroundMusic');
                if (audio) {
                    // Проверяем, не отключен ли звук через кнопку
                    const isMuted = localStorage.getItem('soundMuted') === 'true';
                    if (isMuted) {
                        console.log('🎵 Звук отключен через кнопку, не запускаем музыку');
                        return;
                    }
                    
                    // Добавляем обработчик зацикливания
                    audio.addEventListener('ended', () => {
                        console.log('🎵 Музыка закончилась, перезапускаем...');
                        // Проверяем, не отключен ли звук
                        const isMuted = localStorage.getItem('soundMuted') === 'true';
                        if (!isMuted) {
                            audio.currentTime = 0; // Сбрасываем позицию
                            audio.play().catch(console.log);
                        }
                    });
                    
                    // Пытаемся запустить музыку
                    audio.play().then(() => {
                        console.log('🎵 Музыка успешно запущена');
                    }).catch(error => {
                        console.log('🎵 Ошибка автозапуска музыки (требуется взаимодействие пользователя):', error);
                        // Показываем подсказку для запуска музыки
                    this.showMusicHint();
                    });
                }
            }
            
            showMusicHint() {
                // Получаем текст подсказки из локализации
                const hintText = window.i18n ? window.i18n.t('music.hint') : 'Нажмите в любом месте для запуска музыки';
                
                const hint = document.createElement('div');
                hint.className = 'music-hint';
                hint.textContent = hintText;
                hint.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 0, 0, 0.8);
                    color: white;
                    padding: 20px 40px;
                    border-radius: 10px;
                    z-index: 10000;
                    font-size: 18px;
                    text-align: center;
                `;
                document.body.appendChild(hint);
                
                // Запускаем музыку при первом клике
                const startMusic = () => {
                    const audio = document.getElementById('backgroundMusic');
                    if (audio) {
                        // Проверяем, не отключен ли звук через кнопку
                        const isMuted = localStorage.getItem('soundMuted') === 'true';
                        if (isMuted) {
                            console.log('🎵 Звук отключен через кнопку, не запускаем музыку');
                            hint.remove();
                            return;
                        }
                        
                        // Добавляем обработчик зацикливания, если его еще нет
                        if (!audio.hasAttribute('data-loop-handler-added')) {
                            audio.addEventListener('ended', () => {
                                console.log('🎵 Музыка закончилась, перезапускаем через подсказку...');
                                // Проверяем, не отключен ли звук
                                const isMuted = localStorage.getItem('soundMuted') === 'true';
                                if (!isMuted) {
                                    audio.currentTime = 0; // Сбрасываем позицию
                                    audio.play().catch(console.log);
                                }
                            });
                            audio.setAttribute('data-loop-handler-added', 'true');
                        }
                        
                        audio.play().then(() => {
                            console.log('🎵 Музыка запущена после взаимодействия');
                            hint.remove();
                        }).catch(console.log);
                    }
                    document.removeEventListener('click', startMusic);
                    document.removeEventListener('touchstart', startMusic);
                };
                
                document.addEventListener('click', startMusic);
                document.addEventListener('touchstart', startMusic);
                
                // Автоматически скрываем подсказку через 10 секунд
                setTimeout(() => {
                    if (hint.parentNode) {
                        hint.remove();
                    }
                }, 10000);
            }
            
            async loadPage(pageName) {
                console.log('📄 Загрузка страницы:', pageName);
                
                // Показываем индикатор загрузки
                this.showLoading();
                
                try {
                    // Если страница уже загружена, просто переключаемся на неё
                    if (this.pages.has(pageName)) {
                        this.showPage(pageName);
                        this.hideLoading();
                        return;
                    }
                    
                    // Создаем iframe для страницы
                    const iframe = document.createElement('iframe');
                    // Добавляем timestamp для предотвращения кэширования
                    const timestamp = new Date().getTime();
                    iframe.src = `${pageName}?t=${timestamp}`;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.position = 'absolute';
                    iframe.style.top = '0';
                    iframe.style.left = '0';
                    iframe.style.zIndex = '1';
                    
                    // Создаем контейнер для страницы
                    const pageContainer = document.createElement('div');
                    pageContainer.className = 'page-content';
                    pageContainer.id = `page-${pageName.replace('.html', '')}`;
                    pageContainer.appendChild(iframe);
                    
                    // Добавляем в SPA контейнер
                    document.getElementById('spa-container').appendChild(pageContainer);
                    
                    // Сохраняем страницу
                    this.pages.set(pageName, pageContainer);
                    
                    // Ждем загрузки iframe
                    iframe.onload = () => {
                        console.log('✅ iframe загружен:', pageName);
                        console.log('🎵 iframe src:', iframe.src);
                        console.log('🎵 iframe contentWindow location:', iframe.contentWindow.location.href);
                        this.setupIframeNavigation(iframe, pageName);
                        
                        // Инициализируем звуки геометок в iframe
                        this.initializeIframeGeoMarkerSounds(iframe);
                        
                        console.log('🎵 Вызываем showPage для:', pageName);
                        this.showPage(pageName);
                        this.hideLoading();
                    };
                    
                    iframe.onerror = () => {
                        console.error('❌ Ошибка загрузки iframe:', pageName);
                        this.hideLoading();
                    };
                    
                } catch (error) {
                    console.error('❌ Ошибка загрузки страницы:', error);
                    this.hideLoading();
                }
            }
            
            setupIframeNavigation(iframe, pageName) {
                // Настраиваем навигацию внутри iframe
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Обработчики для стрелок навигации
                    const arrowHandlers = iframeDoc.querySelectorAll('[data-prev-page], [data-next-page]');
                    arrowHandlers.forEach(handler => {
                        handler.addEventListener('click', (e) => {
                            e.preventDefault();
                            const targetPage = handler.dataset.prevPage || handler.dataset.nextPage;
                            if (targetPage) {
                                this.navigateToPage(targetPage);
                            }
                        });
                    });
                    
                    // Обработчики для всех ссылок
                    const links = iframeDoc.querySelectorAll('a[href$=".html"]');
                    links.forEach(link => {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            const href = link.getAttribute('href');
                            if (href) {
                                this.navigateToPage(href);
                            }
                        });
                    });
                    
                    // Обработчики для quest модального окна в iframe
                    this.setupQuestModalHandlers(iframeDoc);
                    
                    // Обработчики для модального окна карты в iframe
                    this.setupMapModalHandlers(iframeDoc);
                    
                } catch (error) {
                    console.log('⚠️ Не удалось настроить навигацию iframe (возможно, CORS):', error);
                }
            }
            
            setupQuestModalHandlers(iframeDoc) {
                console.log('🔧 Настройка обработчиков quest модального окна в iframe...');
                
                // Обработчик для открытия quest модального окна в iframe
                const bookOverlay = iframeDoc.querySelector('.book-overlay');
                if (bookOverlay) {
                    console.log('🔧 Найден book-overlay для обработки открытия модального окна');
                    
                    // Создаем MutationObserver для отслеживания изменений display
                    const observer = new MutationObserver(function(mutations) {
                        mutations.forEach(function(mutation) {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                                const target = mutation.target;
                                const computedStyle = window.getComputedStyle(target);
                                if (computedStyle.display === 'flex') {
                                    console.log('🔧 Quest модальное окно открыто в iframe, отключаем LanguageMenu');
                                    // Отключаем language-menu при открытии модалки
                                    if (window.LanguageMenu && typeof window.LanguageMenu.disableMenu === 'function') {
                                        window.LanguageMenu.disableMenu();
                                    }
                                }
                            }
                        });
                    });
                    
                    // Начинаем наблюдение за изменениями стилей
                    observer.observe(bookOverlay, {
                        attributes: true,
                        attributeFilter: ['style']
                    });
                } else {
                    console.log('⚠️ book-overlay не найден в iframe для обработки открытия');
                }
                
                // Обработчик для кнопки закрытия quest модального окна в iframe
                const questCloseButton = iframeDoc.querySelector('.book-overlay .close-button');
                if (questCloseButton) {
                    console.log('🔧 Найден обработчик кнопки закрытия quest модального окна');
                    questCloseButton.addEventListener('click', function() {
                        console.log('🔧 Клик по кнопке закрытия quest модального окна');
                        const bookOverlay = iframeDoc.querySelector('.book-overlay');
                        const container = iframeDoc.querySelector('.image-container');
                        
                        if (bookOverlay) {
                            bookOverlay.style.display = 'none';
                            
                            // Включаем language-menu при закрытии модалки
                            if (window.LanguageMenu && typeof window.LanguageMenu.enableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.enableMenu() из SPA');
                                window.LanguageMenu.enableMenu();
                            }
                            
                            // Возобновляем анимацию контейнера
                            if (container) {
                                container.style.animationPlayState = 'running';
                            }
                        }
                    });
                } else {
                    console.log('⚠️ Кнопка закрытия quest модального окна не найдена в iframe');
                }

                // Закрытие quest модального окна по клику вне его в iframe
                if (bookOverlay) {
                    console.log('🔧 Найден book-overlay для обработки клика вне модального окна');
                    bookOverlay.addEventListener('click', function(e) {
                        if (e.target === bookOverlay) {
                            console.log('🔧 Клик вне quest модального окна');
                            const container = iframeDoc.querySelector('.image-container');
                            
                            bookOverlay.style.display = 'none';
                            
                            // Включаем language-menu при закрытии модалки
                            if (window.LanguageMenu && typeof window.LanguageMenu.enableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.enableMenu() из SPA (клик вне)');
                                window.LanguageMenu.enableMenu();
                            }
                            
                            // Возобновляем анимацию контейнера
                            if (container) {
                                container.style.animationPlayState = 'running';
                            }
                        }
                    });
                } else {
                    console.log('⚠️ book-overlay не найден в iframe');
                }
            }
            
            setupMapModalHandlers(iframeDoc) {
                console.log('🔧 Настройка обработчиков модального окна карты в iframe...');
                
                // Обработчик для кнопки открытия модального окна карты в iframe
                const openMapButton = iframeDoc.querySelector('#open-map-modal');
                if (openMapButton) {
                    console.log('🔧 Найден обработчик кнопки открытия модального окна карты');
                    openMapButton.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log('🔧 Клик по кнопке открытия модального окна карты');
                        const mapModal = iframeDoc.querySelector('#map-modal');
                        
                        if (mapModal) {
                            mapModal.style.display = 'flex';
                            
                            // Отключаем language-menu при открытии модалки карты
                            if (window.LanguageMenu && typeof window.LanguageMenu.disableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.disableMenu() из SPA (открытие карты)');
                                window.LanguageMenu.disableMenu();
                            }
                        }
                    });
                } else {
                    console.log('⚠️ Кнопка открытия модального окна карты не найдена в iframe');
                }
                
                // Обработчик для кнопки закрытия модального окна карты в iframe
                const mapCloseButton = iframeDoc.querySelector('#close-map-modal');
                if (mapCloseButton) {
                    console.log('🔧 Найден обработчик кнопки закрытия модального окна карты');
                    mapCloseButton.addEventListener('click', function() {
                        console.log('🔧 Клик по кнопке закрытия модального окна карты');
                        const mapModal = iframeDoc.querySelector('#map-modal');
                        
                        if (mapModal) {
                            mapModal.style.display = 'none';
                            
                            // Включаем language-menu при закрытии модалки карты
                            if (window.LanguageMenu && typeof window.LanguageMenu.enableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.enableMenu() из SPA (карта)');
                                window.LanguageMenu.enableMenu();
                            }
                        }
                    });
                } else {
                    console.log('⚠️ Кнопка закрытия модального окна карты не найдена в iframe');
                }

                // Закрытие модального окна карты по клику вне его в iframe
                const mapModal = iframeDoc.querySelector('#map-modal');
                if (mapModal) {
                    console.log('🔧 Найден map-modal для обработки клика вне модального окна');
                    mapModal.addEventListener('click', function(e) {
                        if (e.target === mapModal) {
                            console.log('🔧 Клик вне модального окна карты');
                            
                            mapModal.style.display = 'none';
                            
                            // Включаем language-menu при закрытии модалки карты
                            if (window.LanguageMenu && typeof window.LanguageMenu.enableMenu === 'function') {
                                console.log('🔧 Вызываем LanguageMenu.enableMenu() из SPA (клик вне карты)');
                                window.LanguageMenu.enableMenu();
                            }
                        }
                    });
                } else {
                    console.log('⚠️ map-modal не найден в iframe');
                }
            }
            
            showPage(pageName) {
                console.log('🎵 showPage вызван для:', pageName);
                console.log('🎵 Текущая страница была:', this.currentPage);
                console.log('🎵 Доступные страницы:', Array.from(this.pages.keys()));
                
                // Скрываем все страницы
                this.pages.forEach((page, name) => {
                    page.classList.remove('active');
                    console.log('🎵 Скрываем страницу:', name);
                });
                
                // Показываем нужную страницу
                const targetPage = this.pages.get(pageName);
                if (targetPage) {
                    targetPage.classList.add('active');
                    this.currentPage = pageName;
                    console.log('🎵 Показываем страницу:', pageName);
                    
                    // Обновляем URL без перезагрузки страницы
                    history.pushState({ page: pageName }, '', `#${pageName}`);
                    console.log('🎵 URL обновлен на:', window.location.href);
                    
                    // Переключаем музыку в зависимости от страницы
                    this.switchMusicForPage(pageName);
                } else {
                    console.log('🎵 Страница не найдена:', pageName);
                    console.log('🎵 Доступные страницы:', Array.from(this.pages.keys()));
                }
                
                this.hideLoading();
            }
            
            switchMusicForPage(pageName) {
                console.log('🎵 switchMusicForPage вызван для:', pageName);
                
                // Защита от рекурсии
                if (this._switchingMusic) {
                    console.log('🎵 Переключение музыки уже в процессе, пропускаем');
                    return;
                }
                this._switchingMusic = true;
                
                // Проверяем, не отключен ли звук через кнопку
                const isMuted = localStorage.getItem('soundMuted') === 'true';
                if (isMuted) {
                    console.log('🎵 Звук отключен, пропускаем переключение');
                    this._switchingMusic = false;
                    return;
                }
                
                // Определяем, какая музыка нужна
                if (pageName.includes('tumski19.html')) {
                    console.log('🎵 Переключаем на kostel.mp3 для tumski19.html');
                    this.switchToKostelMusic();
                } else if (pageName.includes('tumski21.html')) {
                    console.log('🎵 Переключаем на hang.mp3 для tumski21.html');
                    this.switchToHangMusic();
                } else if (pageName.includes('ogrod02.html') || pageName.includes('ogrod03.html') || 
                          pageName.includes('ogrod04.html') || pageName.includes('ogrod05.html') || 
                          pageName.includes('ogrod06.html') || pageName.includes('ogrod07.html') || 
                          pageName.includes('ogrod08.html') || pageName.includes('ogrod09.html') || 
                          pageName.includes('ogrod12.html') || pageName.includes('ogrod13.html')) {
                    console.log('🎵 Переключаем на birds.mp3 для страниц ogrod:', pageName);
                    this.switchToBirdsMusic();
                } else {

            async navigateToPage(pageName) {
                console.log('🎵 navigateToPage вызван для:', pageName);
                console.log('🎵 Загруженные страницы:', Array.from(this.pages.keys()));
                
                // Воспроизводим звук шага при навигации
                this.playStepSound();
                
                // Загружаем страницу, если она ещё не загружена
                if (!this.pages.has(pageName)) {
                    console.log('🎵 Страница не загружена, загружаем:', pageName);
                    await this.loadPage(pageName);
                } else {
                    console.log('🎵 Страница уже загружена, принудительно перезагружаем:', pageName);
                    // Удаляем старую страницу и загружаем заново
                    const oldPage = this.pages.get(pageName);
                    if (oldPage) {
                        oldPage.remove();
                        this.pages.delete(pageName);
                    }
                    await this.loadPage(pageName);
                }
            }
            
            showLoading() {
                document.getElementById('loadingOverlay').classList.remove('hidden');
            }
            
            hideLoading() {
                document.getElementById('loadingOverlay').classList.add('hidden');

            setupEventListeners() {
                // Обработчик для кнопки "Назад" в браузере
                window.addEventListener('popstate', (event) => {
                    if (event.state && event.state.page) {
                        this.showPage(event.state.page);
                    }
                });
                
                // Обработчик сообщений от iframe для навигации
                window.addEventListener('message', (event) => {
                    console.log('🎵 Получено сообщение от iframe:', event.data);
                    
                    if (event.data && event.data.type === 'SPA_NAVIGATE') {
                        const targetPage = event.data.page;
                        console.log('🎵 Выполняем навигацию на страницу:', targetPage);
                        
                        if (targetPage) {
                            this.navigateToPage(targetPage);
                        }
                    }
                });
                
                // Мониторинг iframe отключен из-за проблем с рекурсией
                // this.startIframeMonitoring();
            }

            getActiveIframe() {
                // Находим активную страницу и её iframe
                const activePage = document.querySelector('.page-content.active');
                if (activePage) {
                    const iframe = activePage.querySelector('iframe');
                    return iframe;
                }
                return null;
            }
            
            initializeIframeGeoMarkerSounds(iframe) {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const iframeSounds = iframeDoc.querySelectorAll('audio[src*="opening-a-book.wav"]');
                    
                    console.log('🎵 Инициализируем звуки геометок в iframe:', iframeSounds.length);
                    
                    iframeSounds.forEach((audio, index) => {
                        try {
                            if (!audio.src || !audio.src.includes('opening-a-book.wav')) {
                                audio.src = 'media/opening-a-book.wav';
                            }
                            audio.preload = 'auto';
                            audio.load();
                            console.log(`🎵 Звук геометки в iframe ${index + 1} инициализирован:`, audio.src);
                        } catch (error) {
                            console.log('🎵 Ошибка инициализации звука геометки в iframe:', error);
                        }
                    });
                } catch (error) {
                    console.log('🎵 Не удалось получить доступ к iframe для инициализации звуков:', error);
                }
            }
        }
        
        // Инициализируем SPA при загрузке страницы
        document.addEventListener('DOMContentLoaded', async () => {
            // Проверяем, не конфликтует ли с расширениями браузера
            if (window.chrome && window.chrome.runtime && window.chrome.runtime.id) {
                console.log('⚠️ Обнаружено расширение браузера, отключаем проблемные функции');
            }

                await window.i18n.loadTranslations('ru');
                console.log('🔍 Локализация загружена, переводы:', window.i18n.translations);
            }

            if (window.LanguageMenu && typeof window.LanguageMenu.init === 'function') {
                window.LanguageMenu.init();
            }
            
            window.spaManager = new SPAManager();
            window.SPAManager = window.spaManager; // Делаем доступным для iframe страниц
