<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закат над городом - Параллакс эффект</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-container {
            width: 1200px;
            height: 1200px;
            max-width: 100vw;
            max-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .parallax-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        /* Дополнительный слой для заполнения возможных дыр */
        .parallax-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 0;
            pointer-events: none;
        }



        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform-origin: center center;
        }

        .layer-sky {
            background-image: url('media/tumski/sunset/sunset3.png');
            z-index: 1;
        }

        .layer-horizon {
            background-image: url('media/tumski/sunset/sunset2.png');
            z-index: 2;
        }

        .layer-buildings {
            background-image: url('media/tumski/sunset/sunset1.png');
            z-index: 3;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
        }

        .control-group input {
            width: 100%;
            margin-bottom: 5px;
        }

        .control-group button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .control-group button:hover {
            background: #45a049;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            max-width: 300px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .page-container {
                width: 100vw;
                height: 100vh;
            }
            
            .controls {
                top: 10px;
                right: 10px;
                padding: 10px;
                font-size: 12px;
            }
            
            .info {
                bottom: 10px;
                left: 10px;
                padding: 10px;
                font-size: 11px;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="loading">Загрузка изображений...</div>
    
    <div class="page-container">
        <div class="parallax-container">
            <div class="parallax-layer layer-sky"></div>
            <div class="parallax-layer layer-horizon"></div>
            <div class="parallax-layer layer-buildings"></div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Скорость зума:</label>
            <input type="range" id="zoomSpeed" min="0.1" max="2" step="0.1" value="0.3">
            <span id="zoomSpeedValue">0.3</span>
        </div>
        <div class="control-group">
            <label>Пауза:</label>
            <button id="pauseBtn">Пауза</button>
            <button id="resetBtn">Сброс</button>
        </div>
        <div class="control-group">
            <label>Направление:</label>
            <button id="directionBtn">Вперед</button>
        </div>
    </div>

    <div class="info">
        <strong>Эффект параллакса заката</strong><br>
        • sunset3.png - небо (почти статично)<br>
        • sunset2.png - горизонт (медленное движение)<br>
        • sunset1.png - здания (быстрое движение)<br>
        <br>
        Используйте элементы управления для настройки анимации
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="sunset_parallax.js"></script>
</body>
</html>
