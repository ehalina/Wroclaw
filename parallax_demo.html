<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Параллакс Зум - Закат над Тумским островом</title>
    <link rel="stylesheet" href="parallax_demo.css">
</head>
<body>
    <!-- Секция с параллакс-эффектом -->
    <div class="parallax-container">
        <!-- Фоновый слой (sunset3.jpg - дальше всего) -->
        <div class="parallax-layer background" data-speed="0.1">
            <img src="media/tumski/sunset/sunset3.png" alt="Закат фон">
        </div>
        
        <!-- Средний слой (sunset2.png) -->
        <div class="parallax-layer middle" data-speed="0.2">
            <img src="media/tumski/sunset/sunset2.png" alt="Закат средний план">
        </div>
        
        <!-- Передний слой (sunset1.png - ближе всего) -->
        <div class="parallax-layer foreground" data-speed="0.4">
            <img src="media/tumski/sunset/sunset1.png" alt="Закат передний план">
        </div>
    </div>

    <script src="parallax_demo.js"></script>
</body>
</html>
